# ─────────────────────────────────────────────
#  바이럴 쇼츠 자동화 설정
# ─────────────────────────────────────────────
posts_per_run: 4            # 1회 실행당 생성할 글 수 (카테고리별 1개씩 순환)
language: ko
x_post_max_chars: 400      # X 프리미엄 장문 기준. 무료 계정이면 140
render_video: true          # true면 9:16 쇼츠 mp4까지 렌더링
video:
  width: 1080
  height: 1920
  fps: 30
  seconds_per_scene: 3.2
  bgm: true                 # NumPy 합성 BGM (저작권 걱정 없음)

writer:
  # 위에서부터 차례로 시도 → 429·오류면 다음으로 자동 전환 → 전부 안 되면 오프라인 초안
  providers: [anthropic, openai]
  model: claude-opus-5-5        # Claude 모델 (ANTHROPIC_API_KEY)
  openai_model: gpt-4.1-mini    # OpenAI 모델 (OPENAI_API_KEY)
  max_tokens: 4000

dedup:
  similarity_threshold: 0.55   # 과거 글과 이 이상 비슷하면 버림
  check_x_api: true            # X_BEARER_TOKEN 있을 때만 X 검색으로 이미 퍼진 글인지 확인

categories:
  diet:
    label: 다이어트
    ko_keywords: [다이어트, 식단, 공복, 혈당, 식욕]
    en_keywords: [weight loss study, diet research, appetite, blood sugar spike, metabolism]
    subreddits: [loseit, nutrition, EatCheapAndHealthy]
    youtube_queries: ["diet hack shorts", "weight loss tip shorts", "다이어트 꿀팁 shorts"]
  workout:
    label: 살빼는운동
    ko_keywords: [홈트, 뱃살운동, 걷기운동, 계단운동]
    en_keywords: [fat loss workout, walking study, zone 2 cardio, home workout trend]
    subreddits: [bodyweightfitness, Fitness, xxfitness]
    youtube_queries: ["fat burning workout shorts", "home workout shorts", "뱃살 빼는 운동 shorts"]
  world:
    label: 해외이슈
    ko_keywords: [해외 화제, 외신]
    en_keywords: [viral, bizarre news, new law, trend japan, trend usa]
    subreddits: [nottheonion, UpliftingNews, todayilearned]
    youtube_queries: ["viral news shorts", "only in japan shorts", "해외반응 shorts"]
    google_news_feeds:
      - https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
      - https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja
  home:
    label: 살림꿀템
    ko_keywords: [살림꿀팁, 청소꿀팁, 다이소 꿀템, 자취템]
    en_keywords: [cleaning hack, home organization, kitchen hack, laundry hack]
    subreddits: [CleaningTips, LifeProTips, BuyItForLife, organization]
    youtube_queries: ["cleaning hack shorts", "kitchen hack shorts", "살림 꿀팁 shorts"]

# 쓰레드·인스타는 공개 트렌드 API가 없어 직접 넣은 레퍼런스를 함께 씁니다.
# references.txt 에 한 줄에 하나씩: 카테고리|링크 또는 메모
references_file: references.txt
